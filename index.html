/* Five small signals follow the same SVG paths and timings as the original design.
   JavaScript motion is used for consistent playback across browsers. */
(() => {
  const svg = document.querySelector('.hero-art svg');
  if (!svg || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const signals = [...svg.querySelectorAll('circle[data-flow-path]')]
    .map(dot => ({
      dot,
      path: svg.querySelector('#' + dot.dataset.flowPath),
      duration: Number(dot.dataset.duration) * 1000,
      phase: Number(dot.dataset.phase) * 1000
    }))
    .filter(s => s.path && s.duration > 0)
    .map(s => ({...s, length: s.path.getTotalLength()}));
  if (!signals.length) return;
  const origin = performance.now();
  const move = now => {
    for (const s of signals) {
      const progress = (((now - origin - s.phase) % s.duration) + s.duration) % s.duration / s.duration;
      const pt = s.path.getPointAtLength(progress * s.length);
      s.dot.setAttribute('cx', pt.x.toFixed(2));
      s.dot.setAttribute('cy', pt.y.toFixed(2));
    }
    requestAnimationFrame(move);
  };
  requestAnimationFrame(move);
})();
